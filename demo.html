function genSolution(seed) {
  const base = [1,2,3,4,5,6,7,8,9];
  const patterns = [[0,3,6,1,4,7,2,5,8],[0,3,6,2,5,8,1,4,7],[2,5,8,0,3,6,1,4,7]];
  const p = patterns[seed % 3];
  return Array.from({length:9},(_, row)=> {
    const s = p[row];
    return [...base.slice(s), ...base.slice(0,s)];
  });
}

function removeCells(sol, count) {
  const g = sol.map(r=>[...r]);
  const pos = [];
  for(let r=0;r<9;r++) for(let c=0;c<9;c++) pos.push([r,c]);
  for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]]; }
  let removed=0;
  for(const [r,c] of pos){ if(removed>=count)break; if(g[r][c]!==0){g[r][c]=0;removed++;} }
  return g;
}

function genPuzzles(roundType, seed) {
  const count = roundType==='ROUND1_NINE_ONE'?9 : roundType==='ROUND2_RELAY'?4 : 1;
  const emptyCount = roundType==='ROUND1_NINE_ONE'?1 : roundType==='ROUND2_RELAY'?28 : 40;
  const puzzles = [];
  for(let i=0;i<count;i++){
    const sol = genSolution(seed*10+i);
    const init = removeCells(sol.map(r=>[...r]), emptyCount);
    puzzles.push({
      id: seed*100+i+1,
      type: roundType==='ROUND1_NINE_ONE'?'JOC':'STANDARD',
      order: i+1,
      initialGrid: init,
      solution: sol,
      points: 100,
      letter: roundType==='ROUND1_NINE_ONE'?String.fromCharCode(65+i):null,
    });
  }
  return puzzles;
}

}

function renderPlayer() {
  const t = DEMO_TOURNAMENT;
  const r = State.currentRound;

  };

  return `

      <div class="max-w-6xl mx-auto flex items-center justify-between">

        msg.type==='success'?'bg-green-900/40 border border-green-500/20 text-green-300':

        'bg-blue-900/40 border border-blue-500/20 text-blue-300'

      ${State.collectedLetters.length>0?`

        <div class="flex justify-center gap-2">
          ${Array.from({length:9}).map((_,i)=>`
          <span class="w-11 h-11 flex items-center justify-center rounded-xl font-bold text-lg ${
            State.collectedLetters[i]?'bg-purple-600 text-white shadow-lg shadow-purple-600/30':'bg-gray-800 text-gray-600'
          }">${State.collectedLetters[i]||'?'}</span>`).join('')}
        </div>
      </div>`:''}

      <!-- Puzzle tabs -->
      ${State.puzzles.length>1?`
      <div class="flex gap-2 mb-4">
        ${State.puzzles.map((p,i)=>`
        <button onclick="selectPuzzle(${i})" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${
          State.activePuzzleIdx===i?'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20':'bg-gray-800 text-gray-400 hover:bg-gray-700'
        }">第${i+1}题</button>`).join('')}
      </div>`:''}

      <div class="flex gap-6">
        <!-- Grid -->
        <div>
          <div class="inline-block border-2 border-gray-600 rounded-xl overflow-hidden shadow-2xl shadow-black/50">
            ${State.grid.map((row,ri)=>`
            <div class="flex">
              ${row.map((cell,ci)=>{
                const isInitial = puzzle.initialGrid[ri][ci]!==0;
                const isFilled = !isInitial && cell!==0;
                const boxBorder = (ri%3===2&&ri<8?'border-b-[3px] border-b-gray-500':'')+(ci%3===2&&ci<8?' border-r-[3px] border-r-gray-500':'');
                return `<div onclick="clickCell(${ri},${ci})" class="w-14 h-14 flex items-center justify-center text-xl font-bold border border-gray-700/50 cursor-pointer transition-all ${boxBorder} ${
                  isInitial?'bg-gray-800 text-gray-300 cursor-default':
                  isFilled?'bg-indigo-600/80 text-white shadow shadow-indigo-600/30':
                  'bg-gray-900 text-gray-500 hover:bg-indigo-900/30 hover:text-indigo-300'
                }">${cell!==0?cell:''}</div>`;
              }).join('')}
            </div>`).join('')}
          </div>
          <!-- Number pad -->
          <div class="mt-5 flex gap-2">
            ${Array.from({length:9},(_,i)=>i+1).map(n=>`
            <button onclick="inputNumber(${n})" class="w-14 h-14 rounded-xl bg-gray-800 hover:bg-indigo-600 text-white font-bold text-xl transition-all active:scale-90 shadow-lg shadow-black/30">${n}</button>`).join('')}
            <button onclick="inputNumber(0)" class="w-14 h-14 rounded-xl bg-red-900/60 hover:bg-red-700 text-white font-bold text-lg transition-all active:scale-90">✕</button>
          </div>
          ${r.roundType!=='ROUND1_NINE_ONE'?`
          <button onclick="submitFullGrid()" class="mt-4 px-8 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-lg transition shadow-lg shadow-emerald-600/20 active:scale-95">提交完整棋盘</button>
          `:''}
        </div>

        <!-- Side panel -->
        <div class="w-72 space-y-4">
          <div class="bg-gray-900 rounded-xl p-5 border border-white/5">
            <h3 class="text-sm font-semibold text-gray-300 mb-3">轮次信息</h3>
            <div class="space-y-2 text-sm">
              <p class="text-gray-400">类型: <span class="text-white font-medium">${r.name}</span></p>
              <p class="text-gray-400">时长: <span class="text-white font-medium">${r.durationSeconds}s</span></p>
              <p class="text-gray-400">题目: <span class="text-white font-medium">${State.puzzles.length}题</span></p>
            </div>
          </div>
          ${r.roundType && roundDescs[r.roundType]?`
          <div class="${roundDescs[r.roundType].bg} rounded-xl p-5 border">
            <h3 class="text-sm font-semibold ${roundDescs[r.roundType].color} mb-1">${roundDescs[r.roundType].label}</h3>
            <p class="text-xs text-gray-400">${roundDescs[r.roundType].desc}</p>
          </div>`:''}
          <!-- Event log -->
          <div class="bg-gray-900 rounded-xl p-5 border border-white/5">
            <h3 class="text-sm font-semibold text-gray-300 mb-3">事件日志</h3>
            <div class="space-y-1.5 max-h-48 overflow-y-auto text-xs">
              ${State.events.slice(-8).reverse().map(e=>`
              <div class="text-gray-400 py-1 border-b border-gray-800">
                <span class="text-gray-500">${new Date().toLocaleTimeString()}</span> ${e}
              </div>`).join('')}
            </div>
          </div>
        </div>
      </div>
      `:`
      <div class="text-center py-24">
        <div class="text-6xl mb-4">🎮</div>
        <p class="text-gray-400 text-xl">等待轮次开始...</p>
        <p class="text-gray-500 text-sm mt-2">裁判将在控制台启动比赛</p>
      </div>
      `}
    </main>
  </div>`;
}

// ===== ACTIONS =====
function doLogin() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const user = USERS.find(x=>x.username===u&&x.password===p);
  if(user){ State.user=user; State.view='lobby'; render(); }
  else { alert('用户名或密码错误'); }
}

function quickLogin(u,p) {
  const user = USERS.find(x=>x.username===u&&x.password===p);
  if(user){ State.user=user; State.view='lobby'; render(); }
}

function doLogout() {
  State.user=null; State.view='login';
  clearInterval(State.timerInterval);
  clearInterval(State.rotationInterval);
  render();
}

function goDetail() {
  State.view='detail'; render();
}

function goJudge() {
  State.view='judge'; render();
}

function goPlayer() {
  State.view='player'; State.activePuzzleIdx=0; render();
}

function showMsg(text, type='info') {
  State.messages.push({text, type});
  if(State.messages.length>10) State.messages.shift();
  render();
  setTimeout(()=>{ if(State.messages[0]?.text===text){State.messages.shift();render();} },3000);
}

function doStartTournament() {
  DEMO_TOURNAMENT.status='IN_PROGRESS';
  showMsg('比赛已开始！','success');
}

function doPauseTournament() {
  DEMO_TOURNAMENT.status='PAUSED';
  clearInterval(State.timerInterval);
  const r = DEMO_TOURNAMENT.rounds.find(x=>x.status==='IN_PROGRESS');
  if(r) r.status='PAUSED';
  showMsg('比赛已暂停','info');
}

function doResumeTournament() {
  DEMO_TOURNAMENT.status='IN_PROGRESS';
  const r = DEMO_TOURNAMENT.rounds.find(x=>x.status==='PAUSED');
  if(r){ r.status='IN_PROGRESS'; startTimer(r); }
  showMsg('比赛已恢复','success');
}

function doEndTournament() {
  DEMO_TOURNAMENT.status='FINISHED';
  clearInterval(State.timerInterval);
  clearInterval(State.rotationInterval);
  DEMO_TOURNAMENT.rounds.forEach(r=>{if(r.status!=='FINISHED') r.status='FINISHED';});
  State.currentRound=null;
  showMsg('比赛已结束','info');
}

function doStartRound(roundId) {
  const t = DEMO_TOURNAMENT;
  const round = t.rounds.find(r=>r.id===roundId);
  if(!round) return;

  round.status='IN_PROGRESS';
  State.currentRound = round;
  State.timer = { remaining: round.durationSeconds, total: round.durationSeconds };
  State.puzzles = round.puzzles;
  State.activePuzzleIdx = 0;
  State.collectedLetters = [];
  State.events = [];

  // Init grid for active puzzle
  const pz = State.puzzles[0];
  State.grid = pz.initialGrid.map(r=>[...r]);

  startTimer(round);

  // For Round 2, start rotation
  if(round.roundType==='ROUND2_RELAY'){
    clearInterval(State.rotationInterval);
    State.rotationInterval = setInterval(()=>{
      if(State.currentRound?.id===roundId){
        addEvent('题目轮转！已交换给下一位队友');
      }
    },60000);
  }

  addEvent(`第${round.roundNumber}轮开始: ${round.name}`);
  showMsg(`${round.name} 开始！`,'success');
}

function doEndRound(roundId) {
  const round = DEMO_TOURNAMENT.rounds.find(r=>r.id===roundId);
  if(!round) return;
  round.status='FINISHED';
  clearInterval(State.timerInterval);
  clearInterval(State.rotationInterval);
  if(State.currentRound?.id===roundId) State.currentRound=null;
  addEvent(`${round.name} 结束`);
  showMsg(`${round.name} 已结束`,'info');
}

function startTimer(round) {
  clearInterval(State.timerInterval);
  State.timerInterval = setInterval(()=>{
    if(State.timer.remaining<=0){
      clearInterval(State.timerInterval);
      doEndRound(round.id);
      return;
    }
    State.timer.remaining--;
    if(State.timer.remaining<=10 && State.timer.remaining>0){
      // Urgency
    }
    // Update timer display without full re-render
    const timerEl = document.querySelector('.font-mono.text-xl');
    if(timerEl) {
      timerEl.textContent = formatTime(State.timer.remaining);
      timerEl.className = `font-mono text-xl font-bold ${State.timer.remaining<10?'text-red-400 animate-pulse':State.timer.remaining<60?'text-yellow-400':'text-white'}`;
    }
    const barEl = document.querySelector('.h-full.rounded-full');
    if(barEl){
      const pct = (State.timer.remaining/State.timer.total)*100;
      barEl.style.width = pct+'%';
      barEl.className = `h-full rounded-full transition-all duration-1000 ${pct>30?'bg-emerald-500':pct>10?'bg-yellow-500':'bg-red-500'}`;
    }
  },1000);
}

function selectPuzzle(idx) {
  State.activePuzzleIdx = idx;
  const pz = State.puzzles[idx];
  State.grid = pz.initialGrid.map(r=>[...r]);
  render();
}

function clickCell(row, col) {
  const puzzle = State.puzzles[State.activePuzzleIdx];
  if(!puzzle) return;
  if(puzzle.initialGrid[row][col]!==0) return;

  // Highlight selected cell
  document.querySelectorAll('.w-14.h-14').forEach(el=>{
    if(el.style.background?.includes('indigo') && !el.classList.contains('bg-indigo-600/80')){
      el.style.background='';
    }
  });
}

function inputNumber(num) {
  const puzzle = State.puzzles[State.activePuzzleIdx];
  if(!puzzle) return;

  // Find first empty cell for Round 1, or let user tap for others
  if(State.currentRound?.roundType==='ROUND1_NINE_ONE'){
    // Find the empty cell
    let er=-1,ec=-1;
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(puzzle.initialGrid[r][c]===0){er=r;ec=c;}
    if(er===-1) return;

    if(num===0){ State.grid[er][ec]=0; render(); return; }

    // Check answer
    if(puzzle.solution[er][ec]===num){
      State.grid[er][ec]=num;
      addEvent(`正确！第${State.activePuzzleIdx+1}题 +100分`);
      if(puzzle.letter) State.collectedLetters.push(puzzle.letter);

      // Move to next puzzle
      if(State.activePuzzleIdx < State.puzzles.length-1){
        setTimeout(()=>{
          State.activePuzzleIdx++;
          State.grid = State.puzzles[State.activePuzzleIdx].initialGrid.map(r=>[...r]);
          showMsg(`进入第${State.activePuzzleIdx+1}题`,'success');
        },800);
      } else {
        addEvent('所有题目已完成！');
        showMsg('本轮所有题目已完成！','success');
      }
      render();
    } else {
      addEvent(`第${State.activePuzzleIdx+1}题答案错误`);
      showMsg('答案错误，再试一次','error');
    }
    return;
  }

  // For other rounds, just fill the cell (simplified)
  // Find the last clicked or first empty cell
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(puzzle.initialGrid[r][c]===0 && (num===0 ? State.grid[r][c]!==0 : State.grid[r][c]===0)){
        if(num===0){State.grid[r][c]=0; render(); return;}
        State.grid[r][c]=num;
        render();
        return;
      }
    }
  }
}

function submitFullGrid() {
  const puzzle = State.puzzles[State.activePuzzleIdx];
  if(!puzzle) return;
  let correct = true;
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    if(State.grid[r][c]!==puzzle.solution[r][c]){correct=false;break;}
    if(!correct)break;
  }
  if(correct){
    addEvent(`完整棋盘正确！+100分`);
    showMsg('完整棋盘正确！+100分','success');
    if(State.activePuzzleIdx < State.puzzles.length-1){
      setTimeout(()=>{
        State.activePuzzleIdx++;
        State.grid = State.puzzles[State.activePuzzleIdx].initialGrid.map(r=>[...r]);
        render();
      },1000);
    }
  } else {
    addEvent('完整棋盘有误');
    showMsg('棋盘还有错误，请检查','error');
  }
}

function addEvent(text) {
  State.events.push(text);
}

function formatTime(s) {
  if(s==null||s<0) return '--:--';
  const m=Math.floor(s/60);
  const sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function bindEvents() {
  // Keyboard support for number input
  document.onkeydown = (e) => {
    if(State.view!=='player'||!State.currentRound) return;
    const num = parseInt(e.key);
    if(num>=1&&num<=9) inputNumber(num);
    if(e.key==='Backspace'||e.key==='Delete') inputNumber(0);
  };
}

// ===== INIT =====
render();
</script>
</body>
</html>
