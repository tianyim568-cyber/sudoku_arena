<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>阅享绘本趣闯关 · 快乐萌娃大冒险｜乐考闯关测评</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3624;
  --ink-soft:#7a6350;
  --paper:#fff8ef;
  --card:#fffdf8;
  --line:#f0dfc8;
  --shadow:0 10px 28px rgba(122,86,48,.14);
  --radius:20px;
  --g1:#e8875a; --g2:#3e8e8e; --g3:#e0b04a;
  --s-yuwen:#ef6a5a; --s-shuxue:#2fa4a4; --s-kexue:#4c8bdb;
  --s-meishu:#9b72cf; --s-yinyue:#e86a9e; --s-tiyu:#66a84c; --s-laodong:#e8a23d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'ZCOOL KuaiLe','Yuanti SC','YouYuan','PingFang SC',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(232,183,74,.22), transparent 60%),
    radial-gradient(900px 420px at -10% 30%, rgba(62,142,142,.14), transparent 55%),
    var(--paper);
  min-height:100vh;
  font-size:16px;
}
body::before{ /* 纸张噪点 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(120,90,50,.06) 1px, transparent 1.4px);
  background-size:14px 14px;
}
#app{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:14px 14px 40px}

/* ---------- 通用 ---------- */
.view{display:none;animation:pop .32s ease}
.view.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border-radius:16px;font-size:16px;font-weight:700;
  box-shadow:0 6px 0 rgba(0,0,0,.08);transition:transform .08s,box-shadow .08s;
  user-select:none;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn-primary{background:var(--g2);color:#fff}
.btn-warm{background:var(--g1);color:#fff}
.btn-gold{background:var(--g3);color:#5a3d00}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink-soft);box-shadow:none}
.btn-sm{padding:8px 13px;font-size:14px;border-radius:12px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;
  font-size:13px;font-weight:700;color:#fff;
}
.headbar{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.headbar .back{font-size:22px;width:42px;height:42px;border-radius:14px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.headbar h2{font-size:22px;letter-spacing:1px}
.subtitle{color:var(--ink-soft);font-size:14px}
.toast{
  position:fixed;left:50%;bottom:46px;transform:translateX(-50%) translateY(20px);
  background:#3d2c1c;color:#fff;padding:11px 20px;border-radius:99px;font-size:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:82vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 首页 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:30px 22px 26px;color:#fff;
  background:linear-gradient(135deg,#f2a05e 0%,#e8875a 45%,#d96f4c 100%);
  box-shadow:var(--shadow);margin-bottom:18px;text-align:center;
}
.hero.g2{background:linear-gradient(135deg,#8fbf6b 0%,#6aa356 50%,#4f8a44 100%)}
.hero .float{position:absolute;font-size:26px;opacity:.85;animation:float 3.4s ease-in-out infinite}
.hero .eyebrow{font-size:14px;letter-spacing:3px;opacity:.92;margin-bottom:8px}
.hero h1{font-size:30px;line-height:1.3;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.hero .book{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);padding:5px 14px;border-radius:99px;font-size:14px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.grade-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grade-card{
  position:relative;border-radius:24px;padding:20px 16px;color:#fff;text-align:center;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .15s;
}
.grade-card:active{transform:scale(.97)}
.grade-card .big{font-size:44px;margin-bottom:6px}
.grade-card .t1{font-size:22px;letter-spacing:2px}
.grade-card .t2{font-size:13px;opacity:.92;margin-top:4px}
.grade-card .tag{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.28);font-size:12px;padding:3px 9px;border-radius:99px}
.g1-card{background:linear-gradient(150deg,#5ba7a0,#3e8e8e)}
.g2-card{background:linear-gradient(150deg,#8fbf6b,#5f9149)}
.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.quick-item{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:0 4px 12px rgba(122,86,48,.08)}
.quick-item .qi{font-size:24px}
.quick-item .qt{font-size:13px;margin-top:6px;color:var(--ink-soft)}
.foot-note{margin-top:22px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.7}

/* ---------- 枢纽 ---------- */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mode-card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center;box-shadow:var(--shadow)}
.mode-card .mi{font-size:40px}
.mode-card .mt{font-size:19px;margin-top:8px}
.mode-card .md{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.6}
.mode-card:active{transform:scale(.97)}
.banner-mini{border-radius:20px;padding:16px 18px;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.banner-mini .bb{font-size:34px}
.banner-mini .bt{font-size:19px;letter-spacing:1px}
.banner-mini .bs{font-size:13px;opacity:.92;margin-top:2px}

/* ---------- 闯关地图 ---------- */
.map-tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.map-tools select,.map-tools input{
  font-family:inherit;font-size:15px;border:2px solid var(--line);border-radius:14px;padding:9px 12px;background:#fff;color:var(--ink);flex:1;min-width:0;
}
.path{padding-left:8px}
.node{display:flex;gap:0;position:relative}
.node-rail{width:44px;flex:none;display:flex;flex-direction:column;align-items:center}
.node-dot{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15);flex:none;margin-top:2px;border:3px solid #fff;
}
.node-line{flex:1;width:3px;background:repeating-linear-gradient(#e5c9a6 0 8px,transparent 8px 16px);margin:4px 0;border-radius:3px}
.node:last-child .node-line{display:none}
.node-card{
  flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 12px 2px;
  box-shadow:0 5px 14px rgba(122,86,48,.08);transition:transform .12s;
}
.node-card:active{transform:scale(.99)}
.node-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.node-name{font-size:17px;flex:1;min-width:120px}
.node-stars{font-size:14px;color:#d99a2b;white-space:nowrap}
.node-rules{font-size:13px;color:var(--ink-soft);margin-top:7px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node-done{outline:3px solid rgba(102,168,76,.35)}
.sumline{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:14px;color:var(--ink-soft);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(60,40,20,.45);z-index:50;opacity:0;pointer-events:none;transition:.22s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(102%);
  width:100%;max-width:840px;background:var(--paper);border-radius:26px 26px 0 0;z-index:51;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));transition:transform .26s cubic-bezier(.2,.9,.3,1);
  max-height:86vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(0,0,0,.2);
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#e2cdb0;margin:0 auto 14px}
.sheet .s-title{font-size:21px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sheet .s-sub{font-size:14px;color:var(--ink-soft);margin-bottom:14px}
.sheet .sec-title{font-size:15px;color:var(--ink-soft);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.detail-box{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.7;color:#5a4634}
.crit-item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.12s}
.crit-item:active{transform:scale(.985)}
.crit-item .cs{font-size:16px;color:#e0a63a;flex:none;width:30px;text-align:center;padding-top:1px}
.crit-item .ct{font-size:14px;line-height:1.55;color:#5a4634}
.crit-item.on{border-color:#66a84c;background:#f4fbe9;box-shadow:0 0 0 3px rgba(102,168,76,.18)}
.check-item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.check-item .box{width:24px;height:24px;border-radius:8px;border:2px solid #c9b294;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;background:#fff}
.check-item.on{border-color:#66a84c;background:#f4fbe9}
.check-item.on .box{background:#66a84c;border-color:#66a84c}
.crit-score-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big-stars{display:flex;gap:4px;font-size:30px;cursor:pointer}
.big-stars span{color:#e6d6bd;transition:.12s;transform:scale(1)}
.big-stars span.on{color:#f0a93b;text-shadow:0 0 12px rgba(240,169,59,.5)}
.big-stars span:active{transform:scale(1.25)}
.score-preview{font-size:14px;color:var(--ink-soft);background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;margin-top:10px;line-height:1.6;min-height:20px}

/* ---------- 教师评分 ---------- */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stu-chip{background:#fff;border:2px solid var(--line);border-radius:15px;padding:10px 8px;text-align:center;font-size:15px;transition:.12s;position:relative}
.stu-chip .st{display:block;font-size:12px;color:#d99a2b;margin-top:3px}
.stu-chip.sel{border-color:var(--g2);background:#eef7f6;box-shadow:0 0 0 3px rgba(62,142,142,.18)}
.sta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:4px}
.sta-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:11px 10px;font-size:14px;transition:.12s;position:relative}
.sta-card:active{transform:scale(.97)}
.sta-card .sc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sta-card .sc-name{font-size:14px;line-height:1.35}
.sta-card .sc-stars{position:absolute;top:10px;right:10px;font-size:12px;color:#d99a2b}
.sta-card.sel{border-color:var(--g2);background:#eef7f6}
.sta-card .sc-done{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:#66a84c;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.stu-empty{text-align:center;color:var(--ink-soft);padding:30px 0;font-size:15px;line-height:2}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-row input{flex:1;font-family:inherit;font-size:15px;border:2px solid var(--line);border-radius:13px;padding:9px 12px;background:#fff}
.tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#fff;border:2px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;color:var(--ink-soft)}
.tab.sel{background:var(--g2);color:#fff;border-color:var(--g2)}

/* ---------- 统计 ---------- */
.stats-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat-card .sv{font-size:24px;color:var(--g2);font-weight:800}
.stat-card .sl{font-size:12px;color:var(--ink-soft);margin-top:3px}
.table-wrap{background:#fff;border:2px solid var(--line);border-radius:16px;overflow:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid #f3e5d0;padding:8px 7px;text-align:center;font-size:13px;white-space:nowrap}
th{background:#fff6ea;color:#8a6a4a;font-weight:700;position:sticky;top:0}
td.s-name{text-align:left;font-weight:700;color:#5a4634}
td.tot{background:#fff6ea;font-weight:800;color:var(--g2)}
.star-cell{color:#e0a63a}
.star-cell.gray{color:#e6d6bd}
.tool-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.act-row{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- 名单管理 ---------- */
.roster-editor{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.roster-editor textarea{width:100%;height:220px;border:2px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;padding:10px;line-height:1.9;resize:vertical;color:var(--ink)}
.roster-count{font-size:13px;color:var(--ink-soft);margin-top:6px}

/* ---------- 打印闯关卡 ---------- */
#print-area{display:none}
@media print{
  body{background:#fff}
  body::before,#app,.mask,.sheet,.toast{display:none!important}
  #print-area{display:block}
  @page{margin:12mm}
}
.passport{font-family:'Yuanti SC','PingFang SC',sans-serif;color:#2c1e12;max-width:760px;margin:0 auto}
.passport .p-head{text-align:center;border-bottom:3px double #c98f3a;padding-bottom:10px;margin-bottom:12px}
.passport .p-title{font-size:22px;letter-spacing:3px}
.passport .p-sub{font-size:13px;color:#6b5340;margin-top:4px}
.passport .p-info{display:flex;justify-content:center;gap:26px;margin-top:8px;font-size:14px}
.passport .p-info span{border-bottom:1px solid #333;padding:0 8px}
.passport .p-sec{margin:12px 0 6px;font-size:15px;font-weight:700;color:#8a5a1e;border-left:4px solid #e0a63a;padding-left:8px}
.passport .p-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed #e2cdb0;font-size:13px}
.passport .p-row .nm{flex:1}
.passport .p-row .st{font-size:15px;letter-spacing:2px;color:#d99a2b}
.passport .p-row .st .off{color:#e6d6bd}
.passport .p-foot{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:#6b5340}
.passport .p-total{margin-top:10px;text-align:right;font-size:15px;font-weight:700}

/* ---------- 通用响应 ---------- */
@media (max-width:520px){
  .grade-cards{grid-template-columns:1fr}
  .quick-row{grid-template-columns:repeat(4,1fr)}
  .mode-grid{grid-template-columns:1fr}
  .hero h1{font-size:25px}
  .stats-cards{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="print-area"></div>

<script>
/* =========================================================
   数据：关卡配置（依据瓯北第三小学无纸化测评方案）
   ========================================================= */
const SUBJECT_META = {
  '语文':{color:'#ef6a5a',icon:'📖'},
  '数学':{color:'#2fa4a4',icon:'🔢'},
  '科学':{color:'#4c8bdb',icon:'🔬'},
  '美术':{color:'#9b72cf',icon:'🎨'},
  '音乐':{color:'#e86a9e',icon:'🎵'},
  '体育':{color:'#66a84c',icon:'⚽'},
  '劳动':{color:'#e8a23d',icon:'🧺'}
};
const THEME = {
  1:{key:'y1',tone:'g1',title:'小猫探长逛童话路',book:'绘本《一句话专卖店》',emoji:'🐱',
     bannerBg:'linear-gradient(135deg,#5ba7a0,#3e8e8e)',accent:'#3e8e8e',
     intro:'跟着小猫探长走一走童话路，认词语、诵课文、算算术、探科学……集齐星星吧！'},
  2:{key:'y2',tone:'g2',title:'一粒米的奇妙旅行',book:'绘本《盘中餐》',emoji:'🌾',
     bannerBg:'linear-gradient(135deg,#8fbf6b,#5f9149)',accent:'#5f9149',
     intro:'和小米粒一起，从播种到丰收，闯过一个个有趣关卡，收获满满星星吧！'}
};

const ST1=[
{id:'y1-cn1',subject:'语文',name:'词语认读·挑选种子',icon:'🌱',rules:'学生随机抽取一组词语，准确认读课本重点生字、词语，读音标准、口齿清晰、无错读漏读。重点考查平翘舌、前后鼻音、轻声的准确读法。',materials:'平板3台（希望学）；语文老师确认考察字范围，3套题抽其中一套进行认读。',criteria:[{star:5,text:'认读全部正确，字音标准、响亮'},{star:4,text:'错读、漏读1—2个'},{star:3,text:'错读、漏读3—4个'},{star:2,text:'认读错误较多，字音不标准'}]},

const STORE_KEY='obx_lekao_v1';
let DB=load();
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {roster:{},scores:{}};
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){toast('⚠️ 数据保存失败（存储空间不足）');}}
function rosterOf(cls){if(!DB.roster[cls])DB.roster[cls]=[];return DB.roster[cls];}
function scoreKey(g,cls,stu,stId){return g+'|'+cls+'|'+stu+'|'+stId;}
function getScore(g,cls,stu,stId){return DB.scores[scoreKey(g,cls,stu,stId)]||null;}
function setScore(g,cls,stu,stId,val){DB.scores[scoreKey(g,cls,stu,stId)]=val;save();}
function getStar(g,cls,stu,stId){
  const sc=getScore(g,cls,stu,stId);if(!sc)return 0;
  return sc.stars||0;
}
function maxStars(st){
  if(st.checklist)return st.checklist.length;
  const mx=Math.max.apply(null,st.criteria.map(c=>c.star));
  return mx;
}

/* =========================================================

   ========================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(id){return document.getElementById(id);}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1600);
}
function starHTML(n,max,size){
  let h='';
  for(let i=1;i<=max;i++){h+=(i<=n)?'★':'<span class="off">★</span>';}
  return h;
}
function go(view){S.mode=view;render();window.scrollTo(0,0);}
function closeSheet(){
  $('mask').classList.remove('show');$('sheet').classList.remove('show');
  S.station='';
}
function openSheet(html){
  $('sheet').innerHTML=html;
  $('mask').classList.add('show');$('sheet').classList.add('show');
}
function subjectChip(sub){
  const m=SUBJECT_META[sub]||{color:'#999',icon:'📌'};
  return '<span class="chip" style="background:'+m.color+'">'+m.icon+' '+esc(sub)+'</span>';
}

/* ---------- 评分弹层 ---------- */
function openScoreSheet(){
  const st=STATIONS[S.grade].find(x=>x.id===S.station);if(!st)return;
  const m=SUBJECT_META[st.subject];
  const cur=getScore(S.grade,S.cls,S.student,st.id)||{stars:0,checked:[],note:''};
  let inner='';
  if(st.checklist){
    inner=`<div class="sec-title">📌 达标项（打勾后保存）</div>`;
    st.checklist.forEach((c,i)=>{
      const on=cur.checked&&cur.checked[i]?' on':'';
      inner+=`<div class="check-item${on}" onclick="toggleCheck(${i})"><div class="box">✓</div><div class="ct">${esc(c)}</div></div>`;
    });
    inner+=`<div class="score-preview">已达标：<b id="ck-total">${cur.checked?cur.checked.filter(Boolean).length:0}</b> / ${st.checklist.length} 项</div>`;
  }else{
    const max=Math.max.apply(null,st.criteria.map(c=>c.star));
    let stars='';
    for(let i=1;i<=5;i++){
      if(i>max){stars+=`<span style="opacity:.25">★</span>`;continue;}
      stars+=`<span id="bs-${i}" class="${cur.stars>=i?'on':''}" onclick="pickStar(${i})">★</span>`;
    }
    inner=`<div class="sec-title">⭐ 点星星打等级（${max}★ 为最高）</div>
    <div class="crit-score-row"><div class="big-stars">${stars}</div></div>
    <div class="score-preview" id="star-desc">${descForStar(st,cur.stars)}</div>`;
  }
  openSheet(`
    <div class="grab"></div>
    <div class="s-title"><span style="font-size:26px">${st.icon}</span> ${esc(st.name)}</div>
    <div class="s-sub">${subjectChip(st.subject)} · ${esc(S.student)} · ${esc(S.cls)}</div>
    <details style="margin-bottom:8px">
      <summary style="font-size:14px;color:var(--ink-soft);cursor:pointer">📜 查看任务与评价标准</summary>
      <div class="detail-box" style="margin-top:8px">${esc(st.rules)}</div>
      <div class="detail-box" style="margin-top:6px"><b>材料：</b>${esc(st.materials)}</div>
    </details>
    ${inner}
    <div class="act-row" style="margin-top:14px">
      <button class="btn btn-warm btn-sm" onclick="clearScore()">清除评分</button>
      <button class="btn btn-ghost btn-sm" onclick="closeSheet()">关闭</button>
    </div>
  `);
}
function descForStar(st,star){
  if(!star)return '👆 点击星星为这位同学评定等级';
  const c=st.criteria.filter(x=>x.star<=star).sort((a,b)=>b.star-a.star)[0];
  return c?('☆ '.repeat(Math.max(0,c.star-1))+'★ '.repeat(1)+'　'+esc(c.text)):'该等级暂无说明，可手动参考关卡评价标准';
}
function pickStar(n){
  const st=STATIONS[S.grade].find(x=>x.id===S.station);if(!st)return;
  const max=Math.max.apply(null,st.criteria.map(c=>c.star));
  if(n>max){toast('该关最高 '+max+'★');return;}
  for(let i=1;i<=5;i++){const b=$('bs-'+i);if(b)b.className=i<=n?'on':'';}
  const d=$('star-desc');if(d)d.innerHTML=descForStar(st,n);
  setScore(S.grade,S.cls,S.student,st.id,{stars:n,checked:[],note:''});
  toast('已记录 '+n+'★');
}
function toggleCheck(i){
  const st=STATIONS[S.grade].find(x=>x.id===S.station);if(!st)return;
  let cur=getScore(S.grade,S.cls,S.student,st.id)||{stars:0,checked:[],note:''};
  cur.checked=cur.checked||[];
  cur.checked[i]=!cur.checked[i];
  const n=cur.checked.filter(Boolean).length;
  cur.stars=n;
  setScore(S.grade,S.cls,S.student,st.id,cur);
  // 刷新界面勾选态
  openScoreSheet();
}
function clearScore(){
  if(!confirm('确定清除 ' + S.student + ' 在「'+ (STATIONS[S.grade].find(x=>x.id===S.station)||{}).name +'」的评分吗？'))return;
  delete DB.scores[scoreKey(S.grade,S.cls,S.student,S.station)];
  save();
  closeSheet();
  render();
  toast('已清除该关评分');
}

  classes.forEach(c=>{tabs+=`<button class="tab${c===S.cls?' sel':''}" onclick="S.cls='${esc(c)}';render()">${esc(c)}</button>`;});

      const avg=(classTotal/list.length).toFixed(1);
      let doneAll=0;list.forEach(nm=>{let d=0;stations.forEach(st=>{if(getStar(S.grade,S.cls,nm,st.id)>0)d++;});if(d===stations.length)doneAll++;});

      </div>`;
      // 表格
      body+=`<div class="table-wrap"><table>
        <tr><th>学生</th>${stations.map(st=>`<th title="${esc(st.name)}">${st.subject[0]}</th>`).join('')}<th>总星</th><th>进度</th></tr>`;
      list.forEach(nm=>{
        let tot=0,dn=0;
        body+=`<tr><td class="s-name">${esc(nm)}</td>`;
        stations.forEach(st=>{
          const s=getStar(S.grade,S.cls,nm,st.id);tot+=s;if(s>0)dn++;

          body+=`<td class="star-cell${s>0?'':' gray'}">${isCheck?(s+'/'+maxStars(st)):starHTML(s,maxStars(st))}</td>`;
        });
        body+=`<td class="tot">${tot}</td><td style="color:var(--ink-soft)">${dn}/${stations.length}</td></tr>`;
      });
      body+=`</table></div>`;
      // 操作按钮
      body+=`<div class="tool-row">
        <button class="btn btn-primary btn-sm" onclick="exportCSV()">⬇️ 导出CSV成绩表</button>

      </div>`;
      body+=`<div class="act-row">
        <button class="btn btn-ghost btn-sm" onclick="exportJSON()">📦 备份数据</button>
        <button class="btn btn-ghost btn-sm" onclick="importJSON()">📥 恢复数据</button>
        <button class="btn btn-ghost btn-sm" style="color:#c0504d" onclick="resetAll()">🗑️ 清空全部数据</button>
      </div>`;
      body+=`<div class="foot-note" style="margin-top:14px">提示：统计结果仅保存在当前设备的浏览器中，建议导出CSV存档。可到「名单管理」补录/修改学生。</div>`;
    }
  }
  return `
  <div class="headbar">
    <button class="back" onclick="go('hub')">‹</button>
    <h2>统计与导出</h2>
  </div>
  <div class="banner-mini" style="background:${th.bannerBg}">
    <div class="bb">📊</div>
    <div><div class="bt">${S.grade===1?'一年级':'二年级'} · ${esc(th.title)}</div><div class="bs">选择班级查看成绩汇总</div></div>
  </div>
  ${tabs}
  ${body}`;
}

/* ---------- 名单管理 ---------- */
function renderRoster(){
  const th=THEME[S.grade];
  const classes=CLASSES[S.grade];
  let tabs=`<div class="tab-row">`;
  classes.forEach(c=>{tabs+=`<button class="tab${c===S.cls?' sel':''}" onclick="S.cls='${esc(c)}';render()">${esc(c)}</button>`;});
  tabs+=`</div>`;
  let body='';
  if(!S.cls){
    body=`<div class="stu-empty">👆 请先选择班级，再编辑学生名单</div>`;
  }else{
    const list=rosterOf(S.cls);
    body=`<div class="roster-editor">
      <div style="font-size:15px;margin-bottom:6px">📝 ${esc(S.cls)} 学生名单</div>
      <textarea id="roster-ta" placeholder="每行一个学生姓名，例如：&#10;王小明&#10;李小红&#10;张 三">${list.map(esc).join('\n')}</textarea>
      <div class="roster-count">当前共 <b id="rcount">${list.length}</b> 人</div>
      <div class="act-row" style="margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="saveRoster()">💾 保存名单</button>
        <button class="btn btn-ghost btn-sm" onclick="loadSample()">✨ 填入示例名单</button>
        <button class="btn btn-ghost btn-sm" onclick="clearRoster()">🗑️ 清空名单</button>
      </div>
    </div>
    <div class="foot-note" style="margin-top:12px">姓名会作为评分记录的标识，改名/删除会影响已录入的成绩，请谨慎操作。</div>`;
  }
  return `
  <div class="headbar">
    <button class="back" onclick="go('hub')">‹</button>
    <h2>班级名单管理</h2>
  </div>
  <div class="banner-mini" style="background:${th.bannerBg}">
    <div class="bb">📋</div>
    <div><div class="bt">${S.grade===1?'一年级':'二年级'} · ${esc(th.title)}</div><div class="bs">录入学生姓名，教师评分时使用</div></div>
  </div>
  ${tabs}
  ${body}`;
}
function saveRoster(){
  const ta=$('roster-ta');
  const lines=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  const unique=[...new Set(lines)];
  DB.roster[S.cls]=unique;
  save();
  const rc=$('rcount');if(rc)rc.textContent=unique.length;
  toast('已保存 '+unique.length+' 人');
}
function loadSample(){
  const ta=$('roster-ta');if(!ta)return;
  ta.value='王小明\n李小红\n张子轩\n陈思彤\n刘浩然\n赵雨欣\n孙一诺\n周子墨\n吴欣怡\n郑凯文';
  toast('已填入示例名单，记得点保存');
}
function clearRoster(){
  if(!confirm('确定清空 ' + S.cls + ' 的学生名单吗？'))return;
  DB.roster[S.cls]=[];
  save();render();toast('名单已清空');
}

/* =========================================================
   导出 / 打印 / 数据管理
   ========================================================= */
function exportCSV(){
  const stations=STATIONS[S.grade];
  const list=rosterOf(S.cls);
  if(!list.length){toast('该班没有学生，无法导出');return;}
  const header=['班级','姓名',...stations.map(st=>st.name),'总星数','闯关数'];
  const rows=[header];
  list.forEach(nm=>{
    let tot=0,dn=0;
    const cols=stations.map(st=>{
      const s=getStar(S.grade,S.cls,nm,st.id);tot+=s;if(s>0)dn++;
      return s;
    });
    rows.push([S.cls,nm,...cols,tot,dn+'/'+stations.length]);
  });
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download(csv,'瓯北三小乐考-'+S.grade+'年级-'+S.cls+'-成绩.csv','text/csv;charset=utf-8');
  toast('CSV已导出');
}
function exportJSON(){
  const data=JSON.stringify({grade:S.grade,db:DB,exportAt:new Date().toISOString()},null,2);
  download(data,'乐考数据备份-'+new Date().toISOString().slice(0,10)+'.json','application/json');
  toast('数据已备份');
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const obj=JSON.parse(rd.result);
        if(obj.db&&obj.db.roster&&obj.db.scores){DB=obj.db;save();render();toast('✅ 数据恢复成功');}
        else toast('❌ 文件格式不对');
      }catch(e){toast('❌ 解析失败');}
    };
    rd.readAsText(f,'utf-8');
  };
  inp.click();
}
function resetAll(){
  if(!confirm('确定清空当前设备上的全部乐考数据吗？此操作不可恢复！'))return;
  localStorage.removeItem(STORE_KEY);
  DB={roster:{},scores:{}};
  S.cls='';S.student='';S.station='';
  render();toast('已清空全部数据');
}
function download(content,filename,type){
  const blob=new Blob([content],{type:type||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
}

/* ---------- 闯关卡打印 ---------- */
function passportHTML(opts){
  const g=opts.grade, cls=opts.cls, stu=opts.student, fill=opts.fill;
  const stations=STATIONS[g];
  const th=THEME[g];
  const grouped={};
  stations.forEach(st=>{ (grouped[st.subject]=grouped[st.subject]||[]).push(st); });
  let sec='';
  Object.keys(grouped).forEach(sub=>{
    sec+=`<div class="p-sec">${(SUBJECT_META[sub]||{}).icon||''} ${sub}</div>`;
    grouped[sub].forEach(st=>{
      const s=fill&&stu?getStar(g,cls,stu,st.id):0;
      const max=maxStars(st);
      let starStr='';
      if(st.checklist){
        starStr='<span class="st">'+Array.from({length:max},(_,i)=>i<s?'✔':'·').join('')+'</span>';
      }else{
        let h='';
        for(let i=1;i<=max;i++){h+=i<=s?'★':'<span class="off">★</span>';}
        starStr='<span class="st">'+h+'</span>';
      }
      sec+=`<div class="p-row"><span class="nm">${st.icon} ${esc(st.name)}</span>${starStr}</div>`;
    });
  });
  let total=0;
  if(fill&&stu){stations.forEach(st=>{total+=getStar(g,cls,stu,st.id);});}
  const tline=fill&&stu?`<div class="p-total">总星数：${total}</div>`:'';
  const nameLine=fill&&stu?`<span>姓名 ${esc(stu)}</span><span>班级 ${esc(cls)}</span>`:'<span>姓名________</span><span>班级________</span>';
  return `
  <div class="passport">
    <div class="p-head">
      <div class="p-title">🎉 乐考闯关卡</div>
      <div class="p-sub">阅享绘本趣闯关 · 快乐萌娃大冒险（${g===1?'一年级':'二年级'} · ${esc(th.title)}）</div>
      <div class="p-info">${nameLine}<span>日期 2026年6月25日</span></div>
    </div>
    ${sec}
    <div class="p-foot"><span>永嘉县瓯北第三小学</span><span>☺ 恭喜你完成乐考之旅！</span></div>
    ${tline}
  </div>`;
}
function printPassport(){
  if(!S.cls){toast('请先选择班级');return;}
  const list=rosterOf(S.cls);
  if(!list.length){toast('该班没有学生');return;}
  // 弹层选择打印哪个学生
  let opts='';
  list.forEach(nm=>{opts+='<option value="'+esc(nm)+'">'+esc(nm)+'</option>';});
  openSheet(`
    <div class="grab"></div>
    <div class="s-title">🖨️ 打印闯关卡</div>
    <div class="s-sub">选择要打印的学生闯关卡（含已评星星）</div>
    <select id="pstu" class="map-tools" style="width:100%;padding:11px;border:2px solid var(--line);border-radius:14px;font-size:16px;font-family:inherit;background:#fff">${opts}</select>
    <div class="act-row" style="margin-top:14px">
      <button class="btn btn-gold btn-sm" style="flex:1" onclick="doPrintPassport()">打印</button>
      <button class="btn btn-ghost btn-sm" onclick="closeSheet()">取消</button>
    </div>
  `);
}
function doPrintPassport(){
  const stu=$('pstu').value;
  $('print-area').innerHTML=passportHTML({grade:S.grade,cls:S.cls,student:stu,fill:true});
  closeSheet();
  setTimeout(()=>window.print(),120);
}
function printBlankPassport(){
  if(!S.cls){toast('请先选择班级');return;}
  $('print-area').innerHTML=passportHTML({grade:S.grade,cls:S.cls,fill:false});
  setTimeout(()=>window.print(),120);
}

/* =========================================================
   启动
   ========================================================= */
render();
</script>
</body>
</html>
